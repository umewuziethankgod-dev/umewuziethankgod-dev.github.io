<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PiMarket Naija - Spend Pi Map</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f8f7ff}
.header{background:#673ab7;color:white;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:999}
.header h1{font-size:18px}
.header button{background:white;color:#673ab7;border:none;padding:8px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
.search-bar{padding:12px;background:white;display:flex;gap:8px;position:sticky;top:52px;z-index:998;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.search-bar input{flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:20px;outline:none}
.search-bar select{padding:10px;border:1px solid #ddd;border-radius:20px}
#map{height:55vh;width:100%}
.shops{padding:12px;display:grid;gap:12px}
.shop-card{background:white;border-radius:12px;padding:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);border-left:4px solid #673ab7}
.shop-card h3{font-size:15px;margin-bottom:4px}
.shop-card .meta{font-size:12px;color:#666;margin:6px 0}
.badge{background:#e8f5e9;color:#2e7d32;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:bold}
.actions{display:flex;gap:8px;margin-top:8px}
.actions a{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:13px;text-decoration:none;font-weight:bold}
.wa{background:#25D366;color:white}
.dir{background:#673ab7;color:white}
.add-btn{position:fixed;bottom:20px;right:20px;background:#673ab7;color:white;border:none;width:56px;height:56px;border-radius:50%;font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:pointer;z-index:1000}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:2000;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.modal-box{background:white;border-radius:16px;padding:20px;width:100%;max-width:400px}
.modal-box input,.modal-box select,.modal-box textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.modal-box button{width:100%;padding:12px;background:#673ab7;color:white;border:none;border-radius:8px;margin-top:10px;font-weight:bold;cursor:pointer}
.pill{font-size:11px;background:#f3e5f5;color:#673ab7;padding:3px 8px;border-radius:10px}
</style>
</head>
<body>
<div class="header">
<h1>📍 PiMarket Naija</h1>
<button id="loginBtn" onclick="piLogin()">Connect Pi</button>
</div>
<div class="search-bar">
<input id="search" placeholder="Search shop, food, fashion..." oninput="filterShops()">
<select id="cat" onchange="filterShops()"><option value="">All</option><option>Food</option><option>Fashion</option><option>Services</option><option>Real Estate</option><option>Fumigation</option><option>Electronics</option></select>
</div>
<div id="map"></div>
<div class="shops" id="shops"></div>
<button class="add-btn" onclick="openAdd()">+</button>

<div class="modal" id="addModal">
<div class="modal-box">
<h3>Add Your Shop</h3>
<input id="sName" placeholder="Business Name">
<select id="sCat"><option>Food</option><option>Fashion</option><option>Services</option><option>Real Estate</option><option>Fumigation</option><option>Electronics</option></select>
<input id="sAddr" placeholder="Address (e.g., Ikeja, Lagos)">
<input id="sPhone" placeholder="WhatsApp Number (234...)">
<textarea id="sDesc" placeholder="What you sell for Pi"></textarea>
<input id="sLat" placeholder="Latitude (optional)">
<input id="sLng" placeholder="Longitude (optional)">
<button onclick="saveShop()">Add to Map - Free</button>
<button style="background:#eee;color:#333" onclick="closeAdd()">Cancel</button>
<p style="font-size:11px;color:#666;margin-top:8px">Your shop go show after Pi Team verify. Pi KYC vendors only.</p>
</div>
</div>
